<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kindleclip import</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Import sources</h1>
<p>Upload a <code>My Clippings.txt</code> from Kindle storage, a saved Kindle
library web page (<code>.html</code>), or a KOReader JSON highlight export
(<code>.json</code>). Books with the same title are merged and identical
clippings are deduplicated.</p>
<form method="post" action="/import" enctype="multipart/form-data">
  <input type="file" name="file" accept=".txt,.html,.htm,.json" multiple>
  <button type="submit">Import</button>
</form>
<p><a href="/">Back to books</a></p>
</body>
</html>
